name: test
on:
  push:
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.4
      - run: python3 -m py_compile pi/heartbeat.py pi/launcher.py && bash -n pi/setup.sh scripts/release-agent.sh
      # Başlatıcı testleri + pi/heartbeat.py'nin imzası genel anahtarla tutuyor mu (imzalamayı unutmayı yakalar)
      - run: pytest pi/tests -q
