<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'">
<title>Ev Asistanı</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#667085;--line:#e4e7ec;--ok:#12805c;--okbg:#e3f5ee;--bad:#b42318;--badbg:#fde8e6;--warn:#b54708;--warnbg:#fef0db;--bar:#d9822b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--text:#e8eaed;--muted:#98a2b3;--line:#2a313a;--ok:#4cc79a;--okbg:#12342a;--bad:#ff8b82;--badbg:#3a1a17;--warn:#f5b361;--warnbg:#3a2a12;--bar:#e8a054}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.35rem;margin:0}
h2{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:600}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.up{color:var(--ok);background:var(--okbg)}.down{color:var(--bad);background:var(--badbg)}.empty{color:var(--warn);background:var(--warnbg)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}button:disabled{opacity:.55;cursor:wait}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow:hidden}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}
.big{font-size:1.9rem;font-weight:700;line-height:1.1}.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
tr:last-child td{border-bottom:0}.scroll{overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line)}.dot.on{background:var(--ok)}
svg{display:block;width:100%;height:auto}
.axis{fill:var(--muted);font-size:10px}.bar{fill:var(--bar)}.zero{fill:var(--line)}.speed{fill:var(--ok)}
</style>
</head>
<body>
<main>
  <header>
    <h1>🏠 Ev Asistanı</h1>
    <div class="row">
      <span id="pill" class="pill empty">Yükleniyor…</span>
      <button id="live">Canlı ölç</button>
    </div>
  </header>
  <p id="sub" class="muted" style="margin-top:-6px"></p>

  <div class="grid">
    <section class="card"><h2>Pi'nin durumu</h2><div id="info"></div></section>
    <section class="card"><h2>Son 7 gün</h2><div id="s7"></div></section>
    <section class="card"><h2>Son 30 gün</h2><div id="s30"></div></section>
  </div>

  <section class="card" style="margin-bottom:14px">
    <h2>Günlük kesinti süresi (dakika)</h2>
    <div id="chart" role="img" aria-label="Son 30 günün günlük kesinti süresi grafiği"></div>
  </section>

  <section class="card" style="margin-bottom:14px">
    <h2>İnternet hızı (indirme, Mbps)</h2>
    <div id="speedchart" role="img" aria-label="Son hız testlerinin indirme hızı grafiği"></div>
    <div class="scroll" id="speeds" style="margin-top:10px"></div>
  </section>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
    <section class="card"><h2>Son kesintiler</h2><div class="scroll" id="outages"></div></section>
    <section class="card"><h2>Ağ cihazları</h2><div class="scroll" id="devices"></div></section>
  </div>
  <p class="muted" id="foot"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const fmtDur = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h} sa ${m} dk` : m ? `${m} dk ${x} sn` : `${x} sn`; };
const fmtTime = t => new Date(t*1000).toLocaleString('tr-TR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const pct = v => (v*100).toFixed(2).replace('.', ',') + '%';
function el(tag, text, cls){ const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function kv(parent, k, v){ const r = el('div', null, 'kv'); r.append(el('span', k), el('span', v)); parent.append(r); }
function fill(parent, fn){ parent.replaceChildren(); fn(parent); }

function stats(box, st){
  fill(box, p => {
    p.append(el('div', pct(st.avail), 'big'), el('div', 'erişilebilirlik', 'muted'));
    const e = st.kinds.elektrik || {n:0, sec:0}, i = st.kinds.internet || {n:0, sec:0};
    kv(p, '⚡ Elektrik', `${e.n} · ${fmtDur(e.sec)}`);
    kv(p, '🌐 İnternet', `${i.n} · ${fmtDur(i.sec)}`);
    kv(p, 'En uzun kesinti', st.longest ? fmtDur(st.longest) : '—');
  });
}

function speedChart(list){
  const box = $('speedchart');
  if (!list.length) { fill(box, p => p.append(el('p', 'Henüz ölçüm yok. Pi her gece 03:30\'da ölçer.', 'muted'))); return; }
  const pts = list.slice().reverse(), W = 640, H = 140, L = 34, B = 22, T = 8, n = pts.length, bw = (W-L)/Math.max(n, 1);
  const max = Math.max(10, Math.ceil(Math.max(...pts.map(p => p.down_mbps || 0)) / 10) * 10);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const mk = (t, a, txt) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  for (const f of [0, .5, 1]) svg.append(mk('text', {x: L-6, y: T + (H-B-T)*(1-f) + 3, 'text-anchor': 'end', class: 'axis'}, Math.round(max*f)));
  pts.forEach((p, i) => {
    const v = p.down_mbps || 0, h = Math.max(2, (H-B-T) * v / max), x = L + i*bw + 1.5;
    const r = mk('rect', {x, y: H-B-h, width: Math.max(bw-3, 2), height: h, rx: 2, class: 'speed'});
    r.append(mk('title', {}, `${fmtTime(p.at)}: ↓ ${v.toFixed(1)} / ↑ ${(p.up_mbps || 0).toFixed(1)} Mbps · ping ${Math.round(p.ping_ms || 0)} ms`));
    svg.append(r);
  });
  fill(box, p => p.append(svg));
}

function chart(days){
  const W = 640, H = 170, L = 34, B = 22, T = 8, n = days.length, bw = (W-L)/n;
  const max = Math.max(10, Math.ceil(Math.max(...days.map(d => d.sec/60)) / 10) * 10);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const mk = (t, a, txt) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  for (const f of [0, .5, 1]) {
    const y = T + (H-B-T)*(1-f);
    svg.append(mk('text', {x: L-6, y: y+3, 'text-anchor': 'end', class: 'axis'}, Math.round(max*f)));
  }
  days.forEach((d, i) => {
    const h = Math.max(2, (H-B-T) * (d.sec/60) / max), x = L + i*bw + 1.5;
    const r = mk('rect', {x, y: H-B-(d.sec ? h : 2), width: Math.max(bw-3, 2), height: d.sec ? h : 2, rx: 2, class: d.sec ? 'bar' : 'zero'});
    r.append(mk('title', {}, `${d.day}: ${d.sec ? fmtDur(d.sec) : 'kesinti yok'}`));
    svg.append(r);
    if (i % 5 === 0 || i === n-1) svg.append(mk('text', {x: i === n-1 ? W : x + bw/2 - 1.5, y: H-6, 'text-anchor': i === n-1 ? 'end' : 'middle', class: 'axis'}, d.day));
  });
  fill($('chart'), p => p.append(svg));
}

function table(box, head, rows, empty){
  fill(box, p => {
    if (!rows.length) { p.append(el('p', empty, 'muted')); return; }
    const t = el('table'), tr = el('tr');
    head.forEach(h => tr.append(el('th', h))); t.append(tr);
    rows.forEach(r => { const row = el('tr'); r.forEach(c => { const td = el('td'); c instanceof Node ? td.append(c) : (td.textContent = c); row.append(td); }); t.append(row); });
    p.append(t);
  });
}

function render(d){
  const pill = $('pill');
  if (d.status === 'up') { pill.className = 'pill up'; pill.textContent = 'Her şey yolunda'; }
  else if (d.status === 'down') { pill.className = 'pill down'; pill.textContent = 'Bağlantı yok'; }
  else { pill.className = 'pill empty'; pill.textContent = 'Henüz sinyal yok'; }
  $('sub').textContent = d.last_beat ? `Son sinyal ${fmtDur(d.now - d.last_beat)} önce` + (d.down_since ? ` · kesinti ${fmtTime(d.down_since)} tarihinden beri` : '') : '';
  const i = d.info || {};
  fill($('info'), p => {
    kv(p, '🌐 İnternet', i.latency_ms == null ? (i.latency_ms === null ? 'YOK' : '—') : `${i.latency_ms} ms`);
    kv(p, '⏱ Açık kalma', i.uptime != null ? fmtDur(i.uptime) : '—');
    kv(p, '🌡 CPU', i.temp != null ? `${i.temp} °C · yük ${i.load ?? '?'}` : '—');
    kv(p, '💾 Boş RAM', i.mem_mb != null ? `${i.mem_mb} MB` : '—');
    kv(p, '📶 Wi-Fi', i.wifi_dbm != null ? `${i.wifi_dbm} dBm` + (i.ssid ? ` · ${i.ssid}` : '') : '—');
    kv(p, '🧩 Ajan sürümü', i.agent != null ? String(i.agent) : '—');
    kv(p, 'Alarm eşiği', `${d.timeout_sec/60} dk`);
    kv(p, 'Bildirim alan', `${d.members + 1} kişi`);
  });
  stats($('s7'), d.stats['7']); stats($('s30'), d.stats['30']);
  chart(d.daily);
  speedChart(d.speedtests || []);
  table($('speeds'), ['Zaman', 'İndirme', 'Yükleme', 'Ping'],
    (d.speedtests || []).slice(0, 7).map(p => [fmtTime(p.at), `${(p.down_mbps || 0).toFixed(1)} Mbps`, `${(p.up_mbps || 0).toFixed(1)} Mbps`, `${Math.round(p.ping_ms || 0)} ms`]), '');
  table($('outages'), ['Tür', 'Başlangıç', 'Süre'],
    d.outages.map(o => [o.kind === 'elektrik' ? '⚡ Elektrik' : '🌐 İnternet', fmtTime(o.started), fmtDur(o.ended - o.started)]), 'Kayıtlı kesinti yok 🎉');
  table($('devices'), ['Cihaz', 'IP', 'Son görülme'],
    d.devices.map(v => { const c = el('span'); c.append(el('span', null, 'dot' + (v.online ? ' on' : '')), document.createTextNode(v.name || v.host || 'adsız'));
      return [c, v.ip || '?', v.online ? 'şimdi' : fmtTime(v.last_seen)]; }), 'Henüz tarama sonucu yok.');
  $('foot').textContent = d.since ? `Kayıt başlangıcı: ${fmtTime(d.since)} · her 10 sn'de yenilenir` : '';
}

async function load(url, opt){
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error(r.status);
  render(await r.json());
}
$('live').onclick = async () => {
  const b = $('live'); b.disabled = true; b.textContent = 'Ölçülüyor…';
  try { await load('/panel/live', {method: 'POST'}); } catch (e) { $('sub').textContent = 'Canlı ölçüm başarısız (' + e.message + ')'; }
  b.disabled = false; b.textContent = 'Canlı ölç';
};
const tick = () => load('/panel/data').catch(e => { $('sub').textContent = 'Veri alınamadı (' + e.message + ')'; });
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
